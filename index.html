<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>教学管理系统 · 签到 / 作业统计 / 学生与班级管理</title>
<style>
:root{
  --bg:#eef2f9; --bg-2:#f7f9fd; --card:#ffffff; --ink:#0f1a2e; --ink-2:#33415c;
  --muted:#6b7a94; --line:#e2e8f2; --line-2:#eef2f8;
  --primary:#2f6bed; --primary-600:#2a5fd6; --primary-050:#eaf1fe; --primary-100:#dbe7fd;
  --ok:#12a870; --ok-050:#e6f6ef; --warn:#e08a00; --warn-050:#fdf3e2; --danger:#e5484d;
  --danger-050:#fdecec; --info:#6b5bd6; --info-050:#efedfd;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(15,26,46,.05), 0 1px 3px rgba(15,26,46,.06);
  --sh-2:0 6px 20px rgba(15,26,46,.08);
  --sidebar-w:236px; --topbar-h:64px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.01em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e6;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b3c0d8;background-clip:content-box}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:#0e1930;color:#c8d4ec;
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;
}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4d8bff,#2f6bed);color:#fff;box-shadow:0 6px 16px rgba(47,107,237,.4);
}
.brand-txt b{display:block;color:#fff;font-size:15px;letter-spacing:.02em}
.brand-txt span{display:block;font-size:11.5px;color:#8ea1c4;margin-top:1px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-lbl{font-size:11px;color:#6d80a6;letter-spacing:.14em;padding:12px 10px 6px}
.nav-item{
  display:flex;gap:10px;align-items:center;padding:9.5px 11px;border-radius:10px;
  color:#b9c6e0;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;
  transition:background .15s,color .15s;
}
.nav-item svg{flex:0 0 18px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(47,107,237,.32),rgba(47,107,237,.12));color:#fff;border-color:rgba(120,170,255,.28)}
.nav-item.active svg{opacity:1;color:#9dc0ff}
.nav-item .cnt{margin-left:auto;font-size:11px;color:#8ea1c4;background:rgba(255,255,255,.08);padding:1px 7px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#7d90b4}
.sidebar-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#38d39f;margin-right:6px;box-shadow:0 0 0 3px rgba(56,211,159,.16)}

.main{flex:1;min-width:0;margin-left:var(--sidebar-w)}
.topbar{
  height:var(--topbar-h);background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:0 22px;position:sticky;top:0;z-index:40;
}
.hamb{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center}
.tb-title b{display:block;font-size:16px}
.tb-title span{display:block;font-size:12px;color:var(--muted);margin-top:-2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.view{padding:22px 22px 60px;max-width:1320px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8.5px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  cursor:pointer;font-weight:560;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;
}
.btn:hover{background:var(--bg-2);border-color:#d3dcec}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(47,107,237,.28)}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.danger{color:var(--danger);border-color:#f2c9c9;background:#fff}
.btn.danger:hover{background:var(--danger-050)}
.btn.sm{padding:5.5px 10px;font-size:12.5px;border-radius:8px}
.btn.sm svg{width:14px;height:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted);font-weight:560}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.form-grid .span-2{grid-column:1/-1}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.panel + .panel,.grid + .panel,.panel + .grid,.grid + .grid{margin-top:18px}
.panel-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-hd .ttl{font-size:14.5px;font-weight:650}
.panel-hd .sub{font-size:12px;color:var(--muted)}
.panel-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-bd{padding:18px}
.panel-bd.tight{padding:0}
.section-title{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:650;margin:26px 2px 10px}
.section-title:first-child{margin-top:0}

.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.g-2-1{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}

/* stat card = 数字面板 */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--primary));opacity:.9}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:30px;font-weight:750;letter-spacing:-.01em;line-height:1.25;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .d{font-size:12px;color:var(--muted);margin-top:3px}
.stat.ok{--accent:var(--ok)} .stat.warn{--accent:var(--warn)} .stat.danger{--accent:var(--danger)} .stat.info{--accent:var(--info)}
.stat.compact{padding:12px 14px}
.stat.compact .v{font-size:23px}

.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:var(--primary);width:104px;height:104px;flex:0 0 104px;border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0);
  display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.ring b i{font-size:12px;font-style:normal;color:var(--muted);margin-left:1px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-2);min-width:0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
.legend .n{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums;padding-left:14px}

/* tables */
.tbl-wrap{overflow:auto;max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl th,table.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
table.tbl th{position:sticky;top:0;z-index:1;background:#f6f8fc;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.02em}
table.tbl tbody tr:hover{background:#fafcff}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .sid{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
table.tbl .nm{font-weight:600}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty svg{opacity:.5;margin-bottom:8px}
.overflow-note{font-size:11.5px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line-2);background:#fbfcfe}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:#0d8a5d;background:var(--ok-050)}
.badge.warn{color:#a3660a;background:var(--warn-050)}
.badge.danger{color:#c0363b;background:var(--danger-050)}
.badge.info{color:#5646bd;background:var(--info-050)}
.badge.muted{color:var(--muted);background:#f0f3f9}
.badge.plain::before{display:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:#f3f6fb;border:1px solid var(--line);padding:3px 9px;border-radius:8px}
.mono{font-family:var(--mono)}

.bar{height:8px;border-radius:20px;background:var(--line-2);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--primary)}
.bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)} .bar.danger > i{background:var(--danger)}

.list{display:flex;flex-direction:column}
.list-row{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-2)}
.list-row:last-child{border-bottom:0}
.list-row .g{flex:1;min-width:0}
.list-row .t{font-weight:600;font-size:13px}
.list-row .s{font-size:12px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:9px;flex:0 0 32px;display:grid;place-items:center;background:var(--primary-050);color:var(--primary);font-weight:700;font-size:12.5px}

/* drop zone */
.drop{border:1.5px dashed #c9d6ea;border-radius:var(--r-md);padding:26px 18px;text-align:center;background:#fbfdff;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:var(--primary-050)}
.drop svg{color:var(--primary);opacity:.85}
.drop .t{font-weight:600;margin-top:8px}
.drop .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* QR */
.qr-card{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--sh-1)}
.qr-box img{width:228px;height:228px;display:block;image-rendering:pixelated;border-radius:6px}
.qr-box .cap{font-size:12px;color:var(--muted);margin-top:8px}
.qr-side{flex:1;min-width:250px}

.phone{width:290px;border-radius:30px;background:#101827;padding:11px 11px 14px;box-shadow:var(--sh-2);color:#e7ecf6}
.phone .screen{background:#f2f5fb;border-radius:22px;overflow:hidden;color:var(--ink);min-height:430px;display:flex;flex-direction:column}
.phone .notch{height:22px;background:#101827;display:grid;place-items:center}
.phone .notch i{width:74px;height:7px;border-radius:8px;background:#2a3550}
.ph-hd{padding:12px 15px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:650;font-size:13px}
.ph-hd .logo{width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px}
.ph-bd{padding:15px;display:flex;flex-direction:column;gap:13px;flex:1}
.ph-bd .lab{font-size:12px;color:var(--muted);font-weight:600}
.ph-bd select,.ph-bd input{background:#fff}
.scan-frame{position:relative;height:118px;border-radius:14px;background:#0d1526;display:grid;place-items:center;overflow:hidden}
.scan-frame .sq{width:84px;height:84px;border:2px solid #4d8bff;border-radius:10px}
.scan-frame .line{position:absolute;left:18px;right:18px;height:2px;background:linear-gradient(90deg,transparent,#6ea8ff,transparent);animation:scan 2.1s ease-in-out infinite}
@keyframes scan{0%,100%{top:20px}50%{top:94px}}
.ph-ok{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center}
.ph-ok .ic{width:62px;height:62px;border-radius:50%;background:var(--ok-050);color:var(--ok);display:grid;place-items:center}

.tabs{display:flex;gap:4px;background:#f1f4fa;border:1px solid var(--line);padding:4px;border-radius:11px;width:max-content;max-width:100%;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:560;font-size:13px}
.tab:hover{color:var(--ink)}
.tab.active{background:#fff;color:var(--primary);box-shadow:var(--sh-1)}

.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,86vw)}
.toast{background:#101827;color:#eaf0fa;padding:11px 14px;border-radius:12px;box-shadow:var(--sh-2);font-size:13px;display:flex;gap:9px;align-items:flex-start;animation:pop .22s ease}
.toast.ok{background:#0d7a52} .toast.err{background:#b3282d} .toast.warn{background:#8a5606}
.toast svg{flex:0 0 16px;margin-top:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.modal-root{position:fixed;inset:0;z-index:300;display:none}
.modal-root.open{display:block}
.modal-bd{position:absolute;inset:0;background:rgba(10,18,34,.46);backdrop-filter:blur(2px)}
.modal{position:relative;margin:6vh auto;width:min(680px,92vw);max-height:88vh;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease}
.modal-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-hd .ttl{font-weight:650;font-size:15px}
.modal-hd .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.modal-hd .x:hover{background:var(--bg-2)}
.modal-bd-2{padding:18px;overflow:auto}
.modal-ft{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap}
.code-area{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;white-space:pre;overflow:auto}

.backdrop{position:fixed;inset:0;background:rgba(10,18,34,.42);z-index:55;display:none}
.backdrop.open{display:block}

.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
.nowrap{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--line-2);margin:16px 0}

@media (max-width:1080px){
  .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.g-2-1{grid-template-columns:1fr}
}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh-2)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamb{display:inline-flex}
  .view{padding:16px 14px 54px}
  .topbar{padding:0 14px}
  .grid.g3,.grid.g2{grid-template-columns:1fr}
  .qr-box img{width:198px;height:198px}
}
@media (max-width:560px){
  .grid.g4,.grid.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:25px}
  .tb-right .chip{display:none}
  .phone{width:100%;max-width:330px}
  .qr-box img{width:176px;height:176px}
  .tb-title span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </div>
      <div class="brand-txt"><b>教学管理系统</b><span>签到 · 作业统计 · 学生管理</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="sidebar-foot">
      <span class="dot"></span>本地运行 · 数据存于浏览器内存
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" aria-label="打开导航">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="tb-title" id="tbTitle"><b>数据总览</b><span>教学管理系统</span></div>
      <div class="tb-right">
        <span class="chip" id="chipTerm"><span class="dot"></span>2026 秋季学期</span>
        <button class="btn sm" data-act="openImport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>导入数据
        </button>
        <button class="btn sm" data-act="exportAll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>导出数据
        </button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>
<input type="file" id="jsonInput" class="hidden-input" accept=".json,application/json">

<script>/*!

    var a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
    toast("已导出 "+filename,"ok");
  }catch(e){
    openModal({title:"导出内容（请手动复制）",body:'<textarea class="code-area" readonly>'+esc(text)+'</textarea>'});
  }
}
function toCSV(rows){
  return rows.map(function(r){
    return r.map(function(c){
      var s=(c==null?"":String(c));
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }).join("\r\n");
}

if(typeof qrcode!=="undefined" && qrcode.stringToBytesFuncs){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
}
var qrCache={};
function qrDataURL(text,size){
  var key=text+"|"+size;
  if(qrCache[key]) return qrCache[key];
  var qr=qrcode(0,"M"); qr.addData(text,"Byte"); qr.make();
  var n=qr.getModuleCount(), quiet=4, total=n+quiet*2;
  var scale=Math.max(2,Math.floor((size||256)/total)), px=total*scale;
  var cv=document.createElement("canvas"); cv.width=px; cv.height=px;
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,px,px);
  ctx.fillStyle="#0b1324";
  for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale); } }
  var url=cv.toDataURL("image/png");
  qrCache[key]=url; return url;
}

function newCode(){
  var abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="";
  for(var i=0;i<4;i++) s+=abc[Math.floor(Math.random()*abc.length)];
  for(var j=0;j<4;j++) s+=abc[Math.floor(Math.random()*abc.length)];
  return s.slice(0,4)+"-"+s.slice(4);
}

function matchFilename(fname,candidates){
  var digits=fname.match(/\d{6,}/g)||[];
  for(var i=0;i<digits.length;i++){
    for(var j=0;j<candidates.length;j++){
      if(candidates[j].sid===digits[i]) return {student:candidates[j],by:"学号"};
    }
  }
  var sorted=candidates.slice().sort(function(a,b){ return b.name.length-a.name.length; });
  for(var k=0;k<sorted.length;k++){
    if(sorted[k].name && fname.indexOf(sorted[k].name)>=0) return {student:sorted[k],by:"姓名"};
  }
  return null;
}
function buildSubmissionResult(assignment,files){
  var students=classStudents(assignment.classId);
  var roster={}; students.forEach(function(s){ roster[s.id]=s; });
  var others=DB.students.filter(function(s){ return s.classId!==assignment.classId; });
  var hits={}, dup={}, foreign=[], orphan=[];
  files.forEach(function(f){
    var m=matchFilename(f.name,students);
    if(m){
      if(!hits[m.student.id]) hits[m.student.id]={student:m.student,by:m.by,files:[],time:null};
      hits[m.student.id].files.push(f.name);
      if(!hits[m.student.id].time) hits[m.student.id].time=f.time;
      return;
    }
    var mo=matchFilename(f.name,others);
    if(mo) foreign.push({name:f.name,who:mo.student,by:mo.by});
    else orphan.push(f.name);
  });
  var submitted=students.filter(function(s){ return !!hits[s.id]; });
  var missing=students.filter(function(s){ return !hits[s.id]; });
  var dups=Object.keys(hits).filter(function(k){ return hits[k].files.length>1; });
  return {
    students:students, hits:hits, submitted:submitted, missing:missing,
    dupCount:dups.length, dupList:dups, foreign:foreign, orphan:orphan,
    files:files, total:students.length, submittedCount:submitted.length, missingCount:missing.length, rate:pct(submitted.length,students.length)
  };
}

function attendanceStats(session){
  var ro=classStudents(session.classId);
  var rec={}; DB.attendance.forEach(function(a){ if(a.sessionId===session.id) rec[a.studentId]=a; });
  var present=0,late=0,leave=0,absent=0;
  ro.forEach(function(s){ var r=rec[s.id]; if(!r){ absent++; } else if(r.status==="present"){present++;} else if(r.status==="late"){late++;} else if(r.status==="leave"){leave++;} else {absent++;} });
  var attended=present+late;
  return { roster:ro, rec:rec, present:present, late:late, leave:leave, absent:absent, attended:attended, rate:pct(attended,ro.length) };
}
function assignmentStats(a){
  var students=classStudents(a.classId);
  var inClass={}; students.forEach(function(s){ inClass[s.id]=1; });
  var hits={};
  DB.submissions.filter(function(s){ return s.assignmentId===a.id; }).forEach(function(s){
    var sd=byId(DB.students,s.studentId); if(!sd) return;
    if(!hits[s.studentId]) hits[s.studentId]={student:sd,by:s.matchedBy||"学号+姓名",files:[]};
    hits[s.studentId].files=hits[s.studentId].files.concat(s.files||[]);
  });
  Object.keys(hits).forEach(function(k){ if(!inClass[k]) delete hits[k]; });
  var submitted=[],missing=[];
  students.forEach(function(st){ (hits[st.id]?submitted:missing).push(st); });
  var dupCount=Object.keys(hits).filter(function(k){ return hits[k].files.length>1; }).length;
  var fileCount=0; Object.keys(hits).forEach(function(k){ fileCount+=hits[k].files.length; });
  return { students:students, hits:hits, submitted:submitted, missing:missing,
    submittedCount:submitted.length, missingCount:missing.length, dupCount:dupCount,
    total:students.length, rate:pct(submitted.length,students.length), files:fileCount };
}

function viewCheckinStats(){
  var sess=DB.sessions.slice().sort(function(a,b){ return (b.date+b.start)<(a.date+a.start)?-1:1; });
  if(!sess.length) return '<div class="panel"><div class="empty">'+ICON.hw+'<div>暂无签到数据</div></div></div>';
  var sid=state.stat.sessionId && byId(DB.sessions,state.stat.sessionId) ? state.stat.sessionId : sess[0].id;
  state.stat.sessionId=sid;
  var s=byId(DB.sessions,sid); var st=attendanceStats(s); var cl=byId(DB.classes,s.classId);
  var filter=state.stat.filter;
  var rows=[];
  st.roster.forEach(function(std){
    var r=st.rec[std.id];
    var stt = !r?"absent" : r.status;
    if(filter!=="all"){
      if(filter==="attended" && !(stt==="present"||stt==="late")) return;
      if(filter==="absent" && stt!=="absent") return;
      if(filter==="late" && stt!=="late") return;
      if(filter==="leave" && stt!=="leave") return;
    }
    rows.push({std:std, r:r, stt:stt});
  });
  var label={present:"已签到",late:"迟到",leave:"请假",absent:"缺勤"}[filter];
  var html='<div class="panel"><div class="panel-hd"><span class="ttl">'+esc(s.title)+'</span>'+
    '<div style="min-width:230px">'+selectHtml("statSession",sess.map(function(x){ return {v:x.id,t:x.date+" · "+x.title}; }),sid)+'</div>'+
    '<div class="right"><button class="btn sm" data-act="exportAttend">'+ICON.down+'导出签到统计(CSV)</button>'+
    '<button class="btn sm" data-act="printView">'+ICON.print+'打印</button></div></div>'+
    '<div class="panel-bd tight"><div class="panel-bd" style="border-bottom:1px solid var(--line-2)"><div class="grid g5">'+
      statCard("应到",st.roster.length,"人",esc(cl?cl.name:"—"),"")+
      statCard("实到（含迟到）",st.attended,"人","正常 "+st.present+" · 迟到 "+st.late,"ok")+
      statCard("请假",st.leave,"人","已请假不计缺勤","info")+
      statCard("缺勤（未签到）",st.absent,"人","含未签到与缺勤","danger")+
      statCard("签到率",st.rate,"%","(正常+迟到)/应到",st.rate>=90?"ok":st.rate>=80?"warn":"danger")+
    '</div></div>'+
    '<div class="row" style="padding:13px 18px;border-bottom:1px solid var(--line-2)">'+
      '<div class="tabs">'+["all","attended","absent","late","leave"].map(function(f){
        var lb={all:"全部",attended:"已签到",absent:"未签到/缺勤",late:"迟到",leave:"请假"}[f];
        return '<button class="tab'+(filter===f?" active":"")+'" data-act="statFilter" data-f="'+f+'">'+lb+'</button>';
      }).join("")+'</div>'+
      '<span class="spacer"></span><span class="small muted">筛选：'+esc(filter==="all"?"全部":label)+' · '+rows.length+' 条</span>'+
    '</div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>状态</th><th>签到时间</th><th>方式</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(x){
      var b = x.stt==="present"?'<span class="badge ok">已签到</span>':x.stt==="late"?'<span class="badge warn">迟到</span>':x.stt==="leave"?'<span class="badge info">请假</span>':'<span class="badge danger">缺勤</span>';
      return '<tr><td class="sid">'+esc(x.std.sid)+'</td><td class="nm">'+esc(x.std.name)+'</td><td>'+esc(cl?cl.name:"—")+'</td><td>'+b+'</td>'+
        '<td>'+(x.r?esc(x.r.time||"—"):"—")+'</td><td>'+(x.r?esc(x.r.method||"扫码"):"—")+'</td></tr>';
    }).join(""):'<tr><td colspan="6" class="empty">没有符合条件的记录</td></tr>')+
    '</tbody></table></div></div></div>';
  return html;
}

function savedHitFor(a,studentId){
  var subs=DB.submissions.filter(function(s){ return s.assignmentId===a.id && s.studentId===studentId; });
  if(!subs.length) return null;
  var files=[],by=subs[0].matchedBy||"学号+姓名";
  subs.forEach(function(s){ files=files.concat(s.files||[]); });
  return {student:byId(DB.students,studentId),by:by,files:files};
}
function dupCountOf(a){
  var count={}; DB.submissions.forEach(function(s){ if(s.assignmentId===a.id) count[s.studentId]=(count[s.studentId]||0)+1; });
  return Object.keys(count).filter(function(k){ return count[k]>1; }).length;
}
function mountHomework(){
  var asg=$("#hwAssignment");
  if(asg) asg.onchange=function(){ state.hwAssignmentId=this.value; state.hwResult=null; render(); };
  var fi=$("#fileInput");
  if(fi) fi.onchange=function(){ if(this.files && this.files.length) handleFiles(this.files,false); this.value=""; };
  var di=$("#folderInput");
  if(di) di.onchange=function(){ if(this.files && this.files.length) handleFiles(this.files,true); this.value=""; };
  var dz=$("#dropZone");
  if(dz){
    ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add("over"); }); });
    ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove("over"); }); });
    dz.addEventListener("drop",function(e){
      var dt=e.dataTransfer; if(!dt) return;
      var files=dt.files;
      if(files && files.length) handleFiles(files,false);
      else toast("未读取到文件，请改用「文件上传 / 文件夹上传」按钮","warn");
    });
  }
}
function handleFiles(fileList,fromFolder){
  var a=state.hwAssignmentId?byId(DB.assignments,state.hwAssignmentId):null;
  if(!a){ toast("请先创建作业","warn"); return; }
  var files=[];
  for(var i=0;i<fileList.length;i++){
    var f=fileList[i];
    var nm=f.webkitRelativePath || f.name;
    files.push({ name:nm.split("/").pop(), path:nm, size:f.size, time:fmtDT(new Date()) });
  }
  state.hwBusy=true;
  var stat=buildSubmissionResult(a,files);
  /* 本次上传即该作业的最新提交记录：按匹配结果覆盖写回，保证统计与记录一致 */
  DB.submissions=DB.submissions.filter(function(s){ return s.assignmentId!==a.id; });
  Object.keys(stat.hits).forEach(function(stuId){
    var h=stat.hits[stuId];
    DB.submissions.push({ id:uid("B"), assignmentId:a.id, studentId:stuId,
      files:h.files.slice(), matchedBy:h.by, time:h.time||fmtDT(new Date()) });
  });
  state.hwResult={ assignmentId:a.id, files:files, stat:stat, at:fmtDT(new Date()), fromFolder:!!fromFolder };
  state.hwBusy=false;
  render();
  toast("已解析 "+files.length+" 个文件，匹配到 "+stat.submittedCount+" 名学生"+(stat.orphan.length?("，"+stat.orphan.length+" 个无法归属"):""), stat.submittedCount>0?"ok":"warn");
}

}
function actDelSession(id){
  var s=byId(DB.sessions,id); if(!s) return;
  confirmDialog("删除签到会话","将同时删除该会话的 "+DB.attendance.filter(function(a){ return a.sessionId===id; }).length+" 条签到记录，此操作不可撤销。",function(){
    DB.sessions=DB.sessions.filter(function(x){ return x.id!==id; });
    DB.attendance=DB.attendance.filter(function(a){ return a.sessionId!==id; });
    if(state.activeSessionId===id) state.activeSessionId=null;
    if(state.stat.sessionId===id) state.stat.sessionId=null;
    if(state.lastSim && state.lastSim.sessionId===id) state.lastSim=null;
    saveDB(); render(); toast("签到会话已删除","ok");
  },true);
}
function actSimSign(){
  var s=byId(DB.sessions,state.activeSessionId); if(!s){ toast("请先创建签到会话","warn"); return; }
  var sel=$("#sim_student"); if(!sel){ toast("该班暂无学生","warn"); return; }
  var stuId=sel.value; var st=byId(DB.students,stuId); if(!st) return;
  var mode=$("#sim_status")?$("#sim_status").value:"auto";
  var now=new Date();
  var hhmm=pad2(now.getHours())+":"+pad2(now.getMinutes());
  var status="present";
  if(mode==="auto"){ status = (hhmm > (s.lateAfter||"08:10")) ? "late" : "present"; }
  else status=mode;
  var cls=byId(DB.classes,s.classId);
  var rec=DB.attendance.filter(function(a){ return a.sessionId===s.id && a.studentId===stuId; })[0];
  var time=fmtTime(now);
  if(rec){ rec.status=status; rec.time=time; rec.method="扫码"; }
  else DB.attendance.push({ id:uid("A"), sessionId:s.id, studentId:stuId, status:status, time:time, method:"扫码" });
  state.lastSim={ sessionId:s.id, name:st.name, sid:st.sid, cls:cls?cls.name:"—", status:{present:"正常",late:"迟到",leave:"请假",absent:"缺勤"}[status], date:s.date, time:time };
  saveDB(); render();
}
function actExportAttend(){
  var s=byId(DB.sessions,state.stat.sessionId); if(!s){ toast("请选择会话","warn"); return; }
  var st=attendanceStats(s); var cl=byId(DB.classes,s.classId);
  var rows=[["签到统计",s.title+"（"+(cl?cl.name:"")+"）"],["日期",s.date+" "+s.start+"-"+s.end],["签到码",s.code],
    ["应到",st.roster.length],["实到（含迟到）",st.attended],["正常",st.present],["迟到",st.late],["请假",st.leave],["缺勤",st.absent],["签到率",fmtPct(st.rate)],[],
    ["学号","姓名","班级","状态","签到时间","方式"]];
  st.roster.slice().sort(function(a,b){ return a.sid<b.sid?-1:1; }).forEach(function(sd){
    var r=st.rec[sd.id]; var stt=!r?"absent":r.status;
    rows.push([sd.sid,sd.name,cl?cl.name:"",{present:"已签到",late:"迟到",leave:"请假",absent:"缺勤"}[stt], r?r.time:"", r?r.method:"", ]);
  });
  download("签到统计_"+s.date+"_"+((cl?cl.name:"")||"")+".csv",toCSV(rows));
}
function actExportHw(){
  var a=state.hwAssignmentId?byId(DB.assignments,state.hwAssignmentId):null; if(!a){ toast("请先选择作业","warn"); return; }
  var cl=byId(DB.classes,a.classId);
  var useResult=state.hwResult && state.hwResult.assignmentId===a.id;
  var st=useResult?state.hwResult.stat:assignmentStats(a);
  var roster=st.students;
  var rows=[["作业统计",a.title+"（"+(cl?cl.name:"")+"）"],["截止时间",a.deadline],
    ["应交",st.total],["实交",st.submittedCount],["未交",st.total-st.submittedCount],["提交率",fmtPct(st.rate)],[],
    ["学号","姓名","班级","状态","匹配方式","文件"]];
  roster.slice().sort(function(x,y){ return x.sid<y.sid?-1:1; }).forEach(function(sd){
    var hit=st.hits[sd.id];
    rows.push([sd.sid,sd.name,cl?cl.name:"",hit?"已提交":"未提交",hit?hit.by:"",hit?hit.files.join("；"):""]);
  });
  download("作业统计_"+a.title+".csv",toCSV(rows));
}
function actMarkSubmit(asgId,stuId){
  var a=byId(DB.assignments,asgId); if(!a) return;
  if(DB.submissions.some(function(s){ return s.assignmentId===asgId && s.studentId===stuId; })){ toast("该学生已标记为已提交","warn"); return; }
  var st=byId(DB.students,stuId);
  DB.submissions.push({ id:uid("B"), assignmentId:asgId, studentId:stuId, files:["（教师手动标记）"], matchedBy:"手动标记", time:fmtDT(new Date()) });
  if(state.hwResult && state.hwResult.assignmentId===asgId){
    var stat=state.hwResult.stat;
    stat.hits[stuId]={student:st,by:"手动标记",files:["（教师手动标记）"]};
    stat.submitted=stat.students.filter(function(s){ return !!stat.hits[s.id]; });
    stat.missing=stat.students.filter(function(s){ return !stat.hits[s.id]; });
    stat.submittedCount=stat.submitted.length;
    stat.missingCount=stat.missing.length;
    stat.rate=pct(stat.submittedCount,stat.total);
  }
  saveDB(); render(); toast("已标记 "+st.name+" 为已提交","ok");
}

/* ---- 作业动作 ---- */
function actCreateAssignment(){
  if(!DB.classes.length){ toast("请先创建班级","warn"); return; }
  var a={ id:uid("W"), classId:$("#w_class").value, title:($("#w_title").value.trim()|| "未命名作业"), deadline:($("#w_deadline").value.trim()||fmtDate(new Date())+" 23:59"), createdAt:fmtDT(new Date()), source:"手动创建" };
  DB.assignments.push(a);
  state.hwAssignmentId=a.id; state.hwResult=null;
  saveDB(); render(); toast("作业已创建，可上传学生提交文件","ok");
}
function actDelAssignment(id){
  var a=byId(DB.assignments,id); if(!a) return;
  var n=DB.submissions.filter(function(s){ return s.assignmentId===id; }).length;
  confirmDialog("删除作业","将同时删除该作业的 "+n+" 条提交记录，此操作不可撤销。",function(){
    DB.assignments=DB.assignments.filter(function(x){ return x.id!==id; });
    DB.submissions=DB.submissions.filter(function(s){ return s.assignmentId!==id; });
    if(state.hwAssignmentId===id){ state.hwAssignmentId=null; state.hwResult=null; }
    saveDB(); render(); toast("作业已删除","ok");
  },true);
}

/* ---- 学生/班级动作 ---- */
function actAddStudent(){
  if(!DB.classes.length){ toast("请先创建班级","warn"); return; }
  openModal({ title:"新增学生", body:studentForm(null), actions:[
    {label:"取消",kind:"ghost"},
    {label:"保存",kind:"primary",onClick:function(){
      var sid=$("#f_sid").value.trim(), name=$("#f_name").value.trim();
      if(!sid || !name){ toast("学号与姓名不能为空","err"); return false; }
      if(bySid(sid)){ toast("学号已存在：存在重复","err"); return false; }
      DB.students.push({ id:uid("S"), sid:sid, name:name, classId:$("#f_class").value, status:$("#f_status").value, createdAt:fmtDT(new Date()) });
      saveDB(); render(); toast("已新增学生 "+name,"ok");
    }}
  ]});
}
function actEditStudent(id){
  var st=byId(DB.students,id); if(!st) return;
  openModal({ title:"编辑学生 · "+st.name, body:studentForm(st), actions:[
    {label:"取消",kind:"ghost"},
    {label:"保存",kind:"primary",onClick:function(){
      var sid=$("#f_sid").value.trim(), name=$("#f_name").value.trim();
      if(!sid || !name){ toast("学号与姓名不能为空","err"); return false; }
      if(DB.students.some(function(s){ return s.sid===sid && s.id!==id; })){ toast("学号已被其他学生使用","err"); return false; }
      st.sid=sid; st.name=name; st.classId=$("#f_class").value; st.status=$("#f_status").value;
      saveDB(); render(); toast("已保存","ok");
    }}
  ]});
}
function actDelStudent(id){
  var st=byId(DB.students,id); if(!st) return;
  confirmDialog("删除学生","将删除「"+st.name+"」及其签到/提交记录，此操作不可撤销。",function(){
    DB.students=DB.students.filter(function(s){ return s.id!==id; });
    DB.attendance=DB.attendance.filter(function(a){ return a.studentId!==id; });
    DB.submissions=DB.submissions.filter(function(b){ return b.studentId!==id; });
    saveDB(); render(); toast("已删除学生 "+st.name,"ok");
  },true);
}
function actImportStudents(){
  if(!DB.classes.length){ toast("请先创建班级","warn"); return; }
  openModal({ title:"批量导入学生", body:
    '<div class="small muted">每行一名学生，格式：<b>学号,姓名</b>（也支持空格或制表符分隔）。将导入到下方所选班级。</div>'+
    '<div style="margin-top:12px">'+field("导入到班级",'<select id="imp_class">'+DB.classes.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join("")+'</select>')+'</div>'+
    '<div style="margin-top:12px">'+field("学生名单",'<textarea id="imp_text" rows="8" placeholder="2026811001,张三&#10;2026811002,李四"></textarea>')+'</div>',
    actions:[
      {label:"取消",kind:"ghost"},
      {label:"导入",kind:"primary",onClick:function(){
        var cid=$("#imp_class").value; var txt=$("#imp_text").value||"";
        var lines=txt.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
        var ok=0,skip=0;
        lines.forEach(function(ln){
          var parts=ln.split(/[,\t\s]+/).filter(Boolean);
          if(parts.length<2){ skip++; return; }
          var sid=null,name=null;
          if(/^\d{6,}$/.test(parts[0])){ sid=parts[0]; name=parts[1]; }
          else if(/^\d{6,}$/.test(parts[1])){ sid=parts[1]; name=parts[0]; }
          else { skip++; return; }
          if(bySid(sid)){ skip++; return; }
          DB.students.push({ id:uid("S"), sid:sid, name:name, classId:cid, status:"在册", createdAt:fmtDT(new Date()) });
          ok++;
        });
        saveDB(); render();
        toast("导入完成：成功 "+ok+" 人，跳过 "+skip+" 行", ok?"ok":"warn");
      }}
    ]});
}
function actAddClass(){
  openModal({ title:"新增班级", body:classForm(null), actions:[
    {label:"取消",kind:"ghost"},
    {label:"保存",kind:"primary",onClick:function(){
      var name=$("#c_name").value.trim();
      if(!name){ toast("班级名称不能为空","err"); return false; }
      DB.classes.push({ id:uid("C"), name:name, grade:$("#c_grade").value.trim(), teacher:$("#c_teacher").value.trim(), counselor:$("#c_counselor").value.trim(), room:$("#c_room").value.trim(), createdAt:fmtDT(new Date()) });
      saveDB(); render(); toast("已新增班级 "+name,"ok");
    }}
  ]});
}
function actEditClass(id){
  var c=byId(DB.classes,id); if(!c) return;
  openModal({ title:"编辑班级 · "+c.name, body:classForm(c), actions:[
    {label:"取消",kind:"ghost"},
    {label:"保存",kind:"primary",onClick:function(){
      var name=$("#c_name").value.trim();
      if(!name){ toast("班级名称不能为空","err"); return false; }
      c.name=name; c.grade=$("#c_grade").value.trim(); c.teacher=$("#c_teacher").value.trim(); c.counselor=$("#c_counselor").value.trim(); c.room=$("#c_room").value.trim();
      saveDB(); render(); toast("已保存","ok");
    }}
  ]});
}
function actDelClass(id){
  var c=byId(DB.classes,id); if(!c) return;
  var n=classStudents(id).length;
  confirmDialog("删除班级","将删除班级「"+c.name+"」及其中 "+n+" 名学生、相关签到与作业记录，此操作不可撤销。",function(){
    var stIds=DB.students.filter(function(s){ return s.classId===id; }).map(function(s){ return s.id; });
    var sesIds=DB.sessions.filter(function(s){ return s.classId===id; }).map(function(s){ return s.id; });
    var asgIds=DB.assignments.filter(function(a){ return a.classId===id; }).map(function(a){ return a.id; });
    DB.classes=DB.classes.filter(function(x){ return x.id!==id; });
    DB.students=DB.students.filter(function(s){ return s.classId!==id; });
    DB.sessions=DB.sessions.filter(function(s){ return s.classId!==id; });
    DB.assignments=DB.assignments.filter(function(a){ return a.classId!==id; });
    DB.attendance=DB.attendance.filter(function(a){ return sesIds.indexOf(a.sessionId)<0 && stIds.indexOf(a.studentId)<0; });
    DB.submissions=DB.submissions.filter(function(b){ return asgIds.indexOf(b.assignmentId)<0 && stIds.indexOf(b.studentId)<0; });
    if(sesIds.indexOf(state.activeSessionId)>=0) state.activeSessionId=null;
    if(asgIds.indexOf(state.hwAssignmentId)>=0){ state.hwAssignmentId=null; state.hwResult=null; }
    saveDB(); render(); toast("已删除班级 "+c.name,"ok");
  },true);
}

/* ---- 数据管理 ---- */
function actExportAll(){
  download("教学管理系统数据.json",JSON.stringify(DB,null,2),"application/json;charset=utf-8");
}
function actExportTable(name){
  var map={"classes 班级":DB.classes,"students 学生":DB.students,"sessions 签到会话":DB.sessions,"attendance 签到记录":DB.attendance,"assignments 作业":DB.assignments,"submissions 提交记录":DB.submissions};
  var rows=map[name]; if(!rows) return;
  var keys=Object.keys(rows[0]||{});
  if(!keys.length){ toast("空表，无可导出内容","warn"); return; }
  var out=[keys].concat(rows.map(function(r){ return keys.map(function(k){ var v=r[k]; return Array.isArray(v)?v.join("；"):v; }); }));
  download(name.replace(/\s+/g,"_")+".csv",toCSV(out));
}
function actImport(){
  var inp=$("#jsonInput");
  inp.value="";
  inp.onchange=function(){
    var f=this.files && this.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var d=JSON.parse(reader.result);
        if(!d || !Array.isArray(d.students) || !Array.isArray(d.classes)) throw new Error("结构不符");
        DB=d; DB.seq=DB.seq||{};
        ["classes","students","sessions","attendance","assignments","submissions"].forEach(function(k){ if(!Array.isArray(DB[k])) DB[k]=[]; });
        state.activeSessionId=null; state.hwAssignmentId=null; state.hwResult=null; state.lastSim=null; state.stat.sessionId=null;
        saveDB(); render(); toast("数据导入成功","ok");
      }catch(err){ toast("导入失败：文件格式不正确","err"); }
    };
    reader.readAsText(f,"utf-8");
  };
  inp.click();
}
function actResetDemo(){
  confirmDialog("恢复示例数据","将清空当前全部数据并重新载入示例班级、签到与作业数据，此操作不可撤销。",function(){
    seedDemo(); state.activeSessionId=null; state.hwAssignmentId=null; state.hwResult=null; state.lastSim=null; state.stat.sessionId=null;
    state.stu={classId:"all",q:"",tab:"students"}; state.stat={sessionId:null,filter:"all"};
    saveDB(); render(); toast("已恢复示例数据","ok");
  },true);
}

/* ============================================================
 * 11. 启动
 * ========================================================== */
function boot(){
  seedDemo();
  ["classes","students","sessions","attendance","assignments","submissions"].forEach(function(k){ if(!Array.isArray(DB[k])) DB[k]=[]; });
  if(DB.sessions.length) state.activeSessionId=DB.sessions[DB.sessions.length-1].id;
  render();
}
boot();
})();
</script>
