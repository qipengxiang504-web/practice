name: Daily digest

on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC = 08:17 Asia/Shanghai
    - cron: '17 0 * * *'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Generate digest
        run: python agent.py --output output/digest.md
      - name: Show digest in run summary
        run: cat output/digest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: daily-digest
          path: output/digest.md
          if-no-files-found: error
          retention-days: 7
